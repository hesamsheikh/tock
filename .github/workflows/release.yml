# Publishes a release: the FIRE's firmware and the Mac app, built from a version tag on main, as
# a GitHub release. The Mac app offers the latest release as an update
# (companion/Sources/Updater.swift). How to cut one: docs/releasing.md.
#
# Pushing a tag v<version> releases it. Running the workflow by hand (Actions > Release > Run
# workflow) is a dry run: the same checks and builds, with the files attached to the run instead.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # the same versions as a local build: arduino-cli installs the rest from firmware/tock/sketch.yaml
      ARDUINO_CLI_VERSION: 1.5.1
      ESPTOOL_VERSION: 5.3.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all of main, to check the tag is on it

      - name: Check the version
        run: |
          die() { echo "::error::$*"; exit 1; }
          V=$(sed -n 's/^#define TOCK_VERSION "\([^"]*\)".*/\1/p' firmware/tock/system.h)
          APP_V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" companion/Info.plist)
          [ -n "$V" ] || die "no TOCK_VERSION in firmware/tock/system.h"
          [ "$V" = "$APP_V" ] || die "the firmware says $V, companion/Info.plist says $APP_V"
          grep -qE "^## $V( |$)" CHANGELOG.md || die "CHANGELOG.md has no \"## $V\" section"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "$GITHUB_REF_NAME" = "v$V" ] || die "the tag is $GITHUB_REF_NAME, but the version is $V"
            git merge-base --is-ancestor HEAD origin/main || die "$GITHUB_REF_NAME isn't on main"
          fi
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Install arduino-cli and esptool
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_macOS_ARM64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" arduino-cli
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          pipx install "esptool==$ESPTOOL_VERSION"
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"

      # without secrets.h: a release is for everyone
      - name: Build the firmware
        run: firmware/flash.sh --release

      - name: Build the Mac app
        run: companion/build.sh

      - name: Package
        run: |
          mkdir dist
          cp firmware/build/tock.ino.bin dist/tock-fire.bin
          ditto -c -k --keepParent companion/build/Tock.app dist/Tock.zip
          (cd dist && shasum -a 256 Tock.zip tock-fire.bin > SHA256SUMS)
          cat dist/SHA256SUMS
          # the notes: this version's section of the changelog
          awk -v v="$V" '$0 ~ "^## " v "( |$)" { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tock $V" --notes-file notes.md \
            dist/Tock.zip dist/tock-fire.bin dist/SHA256SUMS

      - name: Attach the files to the run (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: tock-${{ env.V }}
          path: |
            dist/
            notes.md
